name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # Playwright (prerender.js in the build) has no Chromium for ubuntu-latest's 26.04 image yet.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
