name: Meta Digest

# Monday after duels.ink's weekly rollover: drafts the Core Bo1 meta digest
# into content/blog/ (draft: true) and commits it to main. Nothing is
# published until someone deletes the draft line.
on:
  schedule:
    - cron: '0 14 * * 1'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  draft:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: node scripts/meta-digest.mjs
      - name: Commit the draft
        run: |
          git add content/blog/
          if git diff --cached --quiet; then exit 0; fi
          week=$(git diff --cached --name-only | sed -n 's|content/blog/core-meta-\(.*\)\.md|\1|p')
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "Draft meta digest for $week"
          git push origin HEAD:main
